services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-seredina}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_migrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seredina}
      APP_TENANT_DB_PASSWORD: ${APP_TENANT_DB_PASSWORD:?set APP_TENANT_DB_PASSWORD in .env}

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://app_tenant:${APP_TENANT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-seredina}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SEREDINA_MODE: ${SEREDINA_MODE:-self_hosted}
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # Same value as CORS_ORIGIN above, but read directly (not just as CORS policy)
      # to build the web app's own public links -- e.g. a CSAT survey link, see
      # docs/adr/0045-csat-surveys.md.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # AI_PROVIDER=ollama pointing at a host-machine Ollama install (not
      # another compose service) needs host.docker.internal, not localhost --
      # this container's own "localhost" is itself, not the host, on the
      # bridge network `api` runs on (unlike `worker` below, which uses host
      # networking for a different reason). e.g.
      # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Only required to connect a Telegram bot (docs/adr/0044-telegram-
      # channel.md) -- must be the real, internet-reachable HTTPS address this
      # container is reachable at, e.g. https://api.yourcompany.com.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
    ports:
      - '${API_PORT:-4000}:4000'

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # network_mode: host below means this container shares the HOST's network
      # namespace, not the compose bridge network -- postgres/redis's service-name
      # DNS ("postgres", "redis") does not resolve here. Connecting via the host's
      # own mapped ports instead works precisely because those services already
      # publish to the host via `ports:`.
      DATABASE_URL: postgresql://app_tenant:${APP_TENANT_DB_PASSWORD}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-seredina}
      REDIS_URL: redis://localhost:${REDIS_PORT:-6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      EMAIL_POLL_INTERVAL_MS: ${EMAIL_POLL_INTERVAL_MS:-30000}
      SENTRY_DSN: ${SENTRY_DSN:-}
    # Agentless discovery (see docs/adr/0002-agentless-discovery.md) needs to reach
    # whatever LAN an operator asks it to scan -- host networking is the pragmatic
    # default for a self-hosted deployment. Linux-only; on Docker Desktop
    # (Mac/Windows) this silently falls back to the container's own isolated
    # network, so discovery jobs there will find nothing outside the compose network.
    network_mode: host

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Baked in at build time -- see Dockerfile.web. Must be reachable from the
        # end user's BROWSER, not from inside the compose network (so not
        # `http://api:4000`), which is why it defaults to the host-mapped API_PORT.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - '${WEB_PORT:-8080}:80'

  # Optional, profile-gated: the MCP server's Streamable HTTP transport (see
  # docs/adr/0035-mcp-http-transport.md). Unlike the stdio transport (meant to
  # be spawned on demand by an MCP client that owns its stdin/stdout, e.g.
  # `docker run -i` from Claude Desktop's own config -- see README's "MCP
  # server" section), HTTP is a genuine always-on network service, so it fits
  # this file. Not started by a plain `docker compose up`; run with
  # `docker compose --profile mcp up` once an operator actually wants to
  # expose it to their own agents.
  mcp-server-http:
    profiles: ['mcp']
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.mcp-server
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: 3100
      DATABASE_URL: postgresql://app_tenant:${APP_TENANT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-seredina}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    ports:
      - '${MCP_HTTP_PORT:-3100}:3100'

volumes:
  postgres_data:
