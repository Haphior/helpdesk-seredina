server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline security headers. No HSTS here -- this container serves plain HTTP;
  # HSTS is sent by the optional `proxy` service (infra/caddy/Caddyfile) that
  # terminates TLS in front of it, since sending it over an HTTP-only origin
  # would be a promise nginx itself isn't the one keeping.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The API lives under /api on this same origin (docs/adr/0054-server-address-and-tls.md),
  # so the console works at any address without a build-time API URL.
  # 8MB attachments (modules/attachments/service.ts) plus multipart overhead.
  client_max_body_size 10m;

  # Docker's embedded DNS, re-resolved every 10s: with a fixed proxy_pass
  # hostname nginx would resolve `api` once at startup and keep a stale IP
  # forever after the api container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;

  # Live console updates (docs/adr/0053-live-updates.md): a long-lived
  # Server-Sent Events stream -- never buffer it, and let it stay open well
  # past the API's own 25s heartbeat.
  location = /api/events {
    rewrite ^ /events break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    # Strip the prefix: /api/tickets?x=1 -> /tickets?x=1 (the query string is kept).
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Passed through from the TLS proxy in front, if any.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # SPA: unknown paths (e.g. /tickets/<uuid>) fall back to index.html so
  # react-router-dom's client-side routing handles them, not nginx 404s.
  location / {
    try_files $uri /index.html;
  }
}
