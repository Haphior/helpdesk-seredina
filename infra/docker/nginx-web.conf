server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline security headers. No HSTS here -- this container serves plain HTTP;
  # HSTS belongs on whatever TLS-terminating reverse proxy an operator puts in
  # front of it (this compose file doesn't include one), since sending it over an
  # HTTP-only origin would be a promise nginx itself isn't the one keeping.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # SPA: unknown paths (e.g. /tickets/<uuid>) fall back to index.html so
  # react-router-dom's client-side routing handles them, not nginx 404s.
  location / {
    try_files $uri /index.html;
  }
}
