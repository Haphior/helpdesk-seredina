<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    Dedicated micro-glyph, not a shrunk copy of Logo.tsx's mark. A favicon is
    always tiny, and at that size a dominant, unmistakably round center plus
    three short "petal" stubs reads correctly, where the full mark's long thin
    arcs collapse into an unreadable smudge. Same three way asymmetry as the
    full mark, unequal petal lengths and widths, just built for the size it is
    actually shown at. Re-angled 2026-09-16 to match Logo.tsx's re-angled
    8/132/242 degree directions (see that file's comment for why).
  -->
  <defs>
    <linearGradient id="seredina-core" x1="70" y1="70" x2="130" y2="130">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <path d="M149.5 107.0 L 177.2 110.9" stroke="#4338ca" stroke-width="24" stroke-linecap="round" fill="none" />
  <path d="M66.5 137.2 L 47.8 158.0" stroke="#6366f1" stroke-width="24" stroke-linecap="round" fill="none" />
  <path d="M76.5 55.9 L 63.4 31.1" stroke="#818cf8" stroke-width="24" stroke-linecap="round" fill="none" />
  <circle cx="100" cy="100" r="55" fill="url(#seredina-core)" />
</svg>
